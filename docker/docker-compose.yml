version: "3.9"

services:
  wavqwise:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
      - "8888:8888"
    volumes:
      - ../demos:/app/demos
      - wavqwise-output:/app/output
    environment:
      - WAVQWISE_DB_URL=postgresql://wavq:wavq@timescaledb:5432/wavqwise
    depends_on:
      timescaledb:
        condition: service_healthy
    command: >
      sh -c "
        echo '=== WavqWise v0.1.5 ===' &&
        echo 'Sense. Forecast. Alert.' &&
        python demos/demo_forecasting.py &&
        python demos/demo_anomaly_detection.py &&
        echo 'Demos complete. Starting Jupyter...' &&
        pip install jupyter -q &&
        jupyter notebook --ip=0.0.0.0 --port=8888 --allow-root --no-browser
      "

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: wavq
      POSTGRES_PASSWORD: wavq
      POSTGRES_DB: wavqwise
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wavq"]
      interval: 5s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: wavqwise
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - timescaledb

volumes:
  pgdata:
  grafana-data:
  wavqwise-output:
